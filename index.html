<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구간대응 최종 퀀트 엔진</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f8f9fa; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #1a365d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .result-box { background: #f1f5f9; padding: 15px; border-radius: 8px; line-height: 1.8; font-size: 14px; }
        .highlight { font-weight: bold; color: #c53030; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎯 파도타기 & 본전 직행 시뮬레이터</h2>
    <input type="text" id="ticker" placeholder="종목명">
    <input type="number" id="avgPrice" placeholder="평단가">
    <input type="number" id="shares" placeholder="보유주수">
    <input type="number" id="resPrice" placeholder="설정 저항선">
    <button onclick="calculateStrategy()">전략 시뮬레이션</button>
</div>

<div class="card" id="resultCard" style="display:none;">
    <div id="output" class="result-box"></div>
</div>

<script>
function calculateStrategy() {
    const avg = parseInt(document.getElementById('avgPrice').value);
    const shares = parseInt(document.getElementById('shares').value);
    const res = parseInt(document.getElementById('resPrice').value);
    
    // 1. 파도타기 로직 (25%)
    const actionShares = Math.floor(shares * 0.25);
    const realizedPL = actionShares * (res - avg);
    const newTotalShares = shares - actionShares; // 매도 후 남은 주수
    const newAvg = (avg * shares - actionShares * res) / newTotalShares;
    const cashSecured = actionShares * res;

    // 2. 본전 직행 로직
    const initialLoss = actionShares * (avg - res); // 예: 870,000원
    const remainingShares = shares - actionShares;
    const breakEvenPrice = ((avg * shares) + initialLoss) / remainingShares;

    const output = document.getElementById('output');
    document.getElementById('resultCard').style.display = 'block';

    output.innerHTML = `
        <strong>🎯 [시나리오 A] 파도타기 1회 성공 시</strong><br>
        - 활용 물량: 매회 ${actionShares}주 (25%)<br>
        - 누적 확정 손실(또는 수익): <span class="highlight">${realizedPL.toLocaleString()}원</span><br>
        - 새로운 평단가: ${Math.floor(newAvg).toLocaleString()}원 (총 ${newTotalShares}주)<br>
        - 확보한 총 현금: +${cashSecured.toLocaleString()}원<br><br>
        
        <strong>🚀 [시나리오 B] 단번 돌파 시 (본전 직행)</strong><br>
        - 본전 도달 시 ${actionShares}주 추가 매도 대응<br>
        - 최종 남은 물량: ${shares - (actionShares * 2)}주<br>
        - 초기 확정 손실: <span class="highlight">${realizedPL.toLocaleString()}원</span><br>
        - 손실 100% 복구 주가: <span class="highlight">${Math.floor(breakEvenPrice).toLocaleString()}원</span>
    `;
}
</script>
</body>
</html>
