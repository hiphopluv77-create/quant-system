<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구간대응 & 차트분석 통합 엔진</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f8f9fa; padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { font-size: 13px; font-weight: bold; color: #4a5568; margin-top: 10px; display: block; }
        input { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #1a365d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-secondary { background-color: #2b6cb0; margin-top: 10px; }
        .result-box { background: #f1f5f9; padding: 15px; border-radius: 8px; line-height: 1.8; font-size: 14px; margin-bottom: 15px; }
        .chart-box { background: #e2e8f0; border-left: 4px solid #4a5568; padding: 15px; border-radius: 8px; line-height: 1.6; font-size: 14px; margin-bottom: 20px;}
        .highlight { font-weight: bold; color: #c53030; }
        .blue { color: #2b6cb0; font-weight: bold; }
        h3 { margin-top: 0; font-size: 16px; border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; }
        .input-group { display: flex; gap: 10px; }
        .input-group > div { flex: 1; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎯 1단계: 종목 차트 분석</h2>
    <label>종목명 (예: 이수페타시스)</label>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="ticker" placeholder="종목명 입력" style="margin-bottom: 0;">
        <button onclick="fetchChartData()" id="fetchBtn" style="width: 150px; margin-top: 0;">차트 불러오기</button>
    </div>
</div>

<div class="card" id="analysisSection" style="display:none;">
    <h3>📊 서버 차트 분석 요약 (자동 판독)</h3>
    <div id="chartOutput" class="chart-box"></div>
    
    <h2>🎯 2단계: 대응 전략 세팅 및 시뮬레이션</h2>
    
    <div class="input-group">
        <div>
            <label>나의 평단가 (원)</label>
            <input type="number" id="avgPrice" placeholder="평단가 입력">
        </div>
        <div>
            <label>보유 주수 (주)</label>
            <input type="number" id="shares" placeholder="보유주수 입력">
        </div>
    </div>

    <div class="input-group">
        <div>
            <label>📈 1차 저항선 (목표 매도가) - 수정 가능</label>
            <input type="number" id="resPrice" style="background-color: #fff5f5; border-color: #feb2b2;">
        </div>
        <div>
            <label>📉 1차 지지선 (재매수 타점) - 수정 가능</label>
            <input type="number" id="supPrice" style="background-color: #ebf8ff; border-color: #90cdf4;">
        </div>
    </div>

    <button onclick="calculateStrategy()" class="btn-secondary">전략 시뮬레이션 가동</button>
</div>

<div class="card" id="resultCard" style="display:none;">
    <h3>🔄 능동적 구간대응 시나리오</h3>
    <div id="strategyOutput" class="result-box"></div>
</div>

<script>
async function fetchChartData() {
    const ticker = document.getElementById('ticker').value;
    if(!ticker) { alert("종목명을 입력해주세요."); return; }

    const btn = document.getElementById('fetchBtn');
    btn.innerText = "불러오는 중...";
    btn.disabled = true;

    try {
        const response = await fetch('https://project-9eedf.vercel.app/api/analyze?ticker=' + encodeURIComponent(ticker));
        const chartData = await response.json();

        const chartOutput = document.getElementById('chartOutput');
        chartOutput.innerHTML = `
            <strong>현재가:</strong> ${chartData.currentPrice.toLocaleString()}원<br>
            <strong>주요 이평선:</strong> 5일(${chartData.ma5.toLocaleString()}) / 20일(${chartData.ma20.toLocaleString()}) / 60일(${chartData.ma60.toLocaleString()}) / 120일(${chartData.ma120.toLocaleString()})<br>
            <strong>볼린저 밴드:</strong> 상단 <span class="highlight">${chartData.bollingerUpper.toLocaleString()}원</span> / 하단 <span class="blue">${chartData.bollingerLower.toLocaleString()}원</span><br>
            <strong>보조지표 상태:</strong> RSI ${chartData.rsi} | ${chartData.trend}
        `;

        document.getElementById('resPrice').value = chartData.autoResistance;
        document.getElementById('supPrice').value = chartData.autoSupport;

        document.getElementById('analysisSection').style.display = 'block';
        document.getElementById('resultCard').style.display = 'none';

    } catch (e) {
        alert("통신 에러: API 서버 상태를 확인해주세요.");
    } finally {
        btn.innerText = "차트 불러오기";
        btn.disabled = false;
    }
}

function calculateStrategy() {
    const avg = parseInt(document.getElementById('avgPrice').value);
    const shares = parseInt(document.getElementById('shares').value);
    const res = parseInt(document.getElementById('resPrice').value);
    const sup = parseInt(document.getElementById('supPrice').value);

    if(!avg || !shares || !res || !sup) { alert("평단가, 보유주수, 저항/지지선을 모두 확인해주세요."); return; }

    const actionShares25 = Math.floor(shares * 0.25);
    const actionShares50 = Math.floor(shares * 0.50);

    // [시나리오 A: 파도타기 로직]
    const realizedPL = actionShares25 * (res - avg);
    const cashSecured = actionShares25 * res; // 매도 시 확보 현금
    const buybackCost = actionShares25 * sup; // 재매수 시 소모 현금
    const remainingCash = cashSecured - buybackCost; // 파도타기 1회전 완료 후 남는 순수 현금 차익

    // 재매수 완료 후 새로운 평단가 산출
    const newTotalCost = (avg * shares) - cashSecured + buybackCost;
    const finalNewAvg = newTotalCost / shares;

    // [시나리오 B: 본전 직행 로직]
    const totalCostB = avg * shares;
    const targetPriceB = (totalCostB - (actionShares25 * res) - (actionShares25 * avg)) / actionShares50;

    const strategyOutput = document.getElementById('strategyOutput');
    strategyOutput.innerHTML = `
        <strong>[1. 시나리오 A: 파도타기]</strong><br>
        - 25% 저항선 매도: ${actionShares25}주 @ ${res.toLocaleString()}원<br>
        - 확정 손익: <span class="${realizedPL >= 0 ? 'highlight' : 'blue'}">${realizedPL.toLocaleString()}원</span><br>
        - 💡 <strong class="blue">대응:</strong> 주가가 <span class="blue">${sup.toLocaleString()}원(지지선)</span>까지 눌릴 경우, 확보한 현금으로 ${actionShares25}주 재매수.<br>
        - <strong>새로운 평단가:</strong> <span class="highlight">${Math.floor(finalNewAvg).toLocaleString()}원</span> (총 ${shares}주)<br>
        - <strong>최종 확보 현금:</strong> <span class="highlight">${remainingCash >= 0 ? '+' : ''}${remainingCash.toLocaleString()}원</span><br><br>
        
        <strong>[2. 시나리오 B: 슈팅 시 본전 직행]</strong><br>
        - 저항선 매도(25%): ${actionShares25}주 @ ${res.toLocaleString()}원<br>
        - 본전 방어 매도(25%): ${actionShares25}주 @ ${avg.toLocaleString()}원<br>
        - <strong>회복 목표가:</strong> 나머지 50%를 <span class="highlight">${Math.floor(targetPriceB).toLocaleString()}원</span>에 매도 시 전체 손실 0원 (본전).
    `;

    document.getElementById('resultCard').style.display = 'block';
}
</script>
</body>
</html>
