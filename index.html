<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구간대응 최종 퀀트 엔진</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f8f9fa; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background-color: #1a365d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .result-box { background: #f1f5f9; padding: 15px; border-radius: 8px; line-height: 1.8; font-size: 14px; }
        .highlight { font-weight: bold; color: #c53030; }
        .blue { color: #2b6cb0; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎯 구간대응 핵심 전략 엔진</h2>
    <input type="text" id="ticker" placeholder="종목명">
    <input type="number" id="avgPrice" placeholder="평단가">
    <input type="number" id="shares" placeholder="보유주수">
    <button onclick="fetchAndCalculate()" id="analyzeBtn">키움 데이터 연동 및 전략 계산</button>
</div>

<div class="card" id="resultCard" style="display:none;">
    <div id="output" class="result-box"></div>
</div>

<script>
// 1. 키움 API 연동 부분 (서버에서 데이터 가져오기)
async function fetchAndCalculate() {
    const ticker = document.getElementById('ticker').value;
    const avg = parseInt(document.getElementById('avgPrice').value);
    const shares = parseInt(document.getElementById('shares').value);

    if(!ticker || !avg || !shares) { alert("입력값을 확인해주세요."); return; }

    try {
        const btn = document.getElementById('analyzeBtn');
        btn.innerText = "키움 데이터 연동 중...";
        
        // Vercel 서버로 키움 데이터를 요청
        const response = await fetch('https://project-9eedf.vercel.app/api/analyze?ticker=' + encodeURIComponent(ticker));
        const data = await response.json();

        // 서버에서 받아온 [저항선] 데이터를 사용하여 전략 계산
        calculateStrategy(avg, shares, data.resistanceLine);

    } catch (e) {
        alert("서버 연결 실패. 키움 API 키 설정을 확인해주세요.");
    }
}

// 2. 선호님의 핵심 전략 계산 로직
function calculateStrategy(avg, shares, res) {
    const actionShares25 = Math.floor(shares * 0.25); // 25% 대응 물량
    const actionShares50 = Math.floor(shares * 0.50); // 50% 회복 물량

    // [시나리오 A: 파도타기]
    const realizedPL = actionShares25 * (res - avg);
    const newTotalShares = shares - actionShares25;
    const newAvg = (avg * shares - actionShares25 * res) / newTotalShares;
    const cashSecured = actionShares25 * res;

    // [시나리오 B: 본전 직행 (능동적 복구)]
    // 25% 저항 매도 + 25% 본전 매도 + 50% 회복 매도
    // 총 매도금액 = (25% * res) + (25% * avg) + (50% * Target) = Total Cost
    // Target = (Total Cost - (0.25*shares*res) - (0.25*shares*avg)) / (0.5*shares)
    const totalCost = avg * shares;
    const cashFromRes = actionShares25 * res;
    const cashFromAvg = actionShares25 * avg;
    const targetPrice = (totalCost - cashFromRes - cashFromAvg) / actionShares50;

    const output = document.getElementById('output');
    document.getElementById('resultCard').style.display = 'block';

    output.innerHTML = `
        <strong>[1. 시나리오 A: 파도타기]</strong><br>
        - 대응 물량: ${actionShares25}주 (25%)<br>
        - 확정 손익: <span class="${realizedPL >= 0 ? 'highlight' : 'blue'}">${realizedPL.toLocaleString()}원</span><br>
        - 새로운 평단가: <span class="highlight">${Math.floor(newAvg).toLocaleString()}원</span> (남은 ${newTotalShares}주)<br>
        - 확보한 현금: +${cashSecured.toLocaleString()}원<br><br>
        
        <strong>[2. 시나리오 B: 본전 직행(능동 복구)]</strong><br>
        - 저항선 매도(25%): ${actionShares25}주 @ ${res.toLocaleString()}원<br>
        - 본전 매도(25%): ${actionShares25}주 @ ${avg.toLocaleString()}원<br>
        - <strong>회복 목표가:</strong> 나머지 50%를 <span class="highlight">${Math.floor(targetPrice).toLocaleString()}원</span>에 매도 시 전체 본전.<br>
        - <em>(설명: 25% 손실을 본전 매도로 방어하고, 나머지 물량으로 전체 손실을 0으로 만드는 구간대응 핵심 전략)</em>
    `;
}
</script>
</body>
</html>
